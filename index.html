<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>The Pizza Point - Mobile POS</title>
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, sans-serif; }
        body { margin: 0; background: #e2e8f0; color: #0f172a; padding-bottom: 70px; }

        .top-bar { background: #0f172a; color: #fff; padding: 10px 12px; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 100; }
        .brand { font-size: 15px; font-weight: bold; color: #facc15; }
        .clock { font-size: 11px; color: #cbd5e1; margin-left: 6px; }

        .order-types { display: grid; grid-template-columns: repeat(4, 1fr); gap: 5px; padding: 8px; background: #1e293b; }
        .type-btn { padding: 8px 4px; border: none; border-radius: 6px; font-size: 11px; font-weight: bold; cursor: pointer; background: #334155; color: #e2e8f0; transition: 0.2s; }
        .type-btn.active { background: #10b981; color: #fff; box-shadow: 0 0 8px rgba(16,185,129,0.5); }

        .meta-bar { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 6px; padding: 8px; background: #fff; border-bottom: 1px solid #cbd5e1; }
        .meta-bar input, .meta-bar select { width: 100%; padding: 6px 8px; border: 1px solid #cbd5e1; border-radius: 5px; font-size: 12px; }

        .delivery-box { display: none; padding: 8px; background: #fef9c3; border-bottom: 1px solid #facc15; }
        .delivery-box input { width: 100%; padding: 7px 10px; border: 1px solid #eab308; border-radius: 5px; font-size: 12px; background: #fff; }

        .pos-wrapper { display: flex; flex-direction: column; gap: 10px; padding: 8px; max-width: 1250px; margin: auto; }
        @media(min-width: 768px) {
            .pos-wrapper { flex-direction: row; align-items: flex-start; }
            .menu-panel { flex: 1.5; }
            .bill-panel { flex: 1; position: sticky; top: 55px; }
        }

        .cat-scroll { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 6px; margin-bottom: 8px; scrollbar-width: none; }
        .cat-pill { background: #fff; border: 1px solid #94a3b8; padding: 6px 12px; border-radius: 20px; font-size: 12px; font-weight: bold; white-space: nowrap; cursor: pointer; }
        .cat-pill.active { background: #dc2626; color: #fff; border-color: #dc2626; }

        .menu-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
        @media(min-width: 500px) { .menu-grid { grid-template-columns: repeat(4, 1fr); } }

        .item-card { background: #fff; border-radius: 8px; overflow: hidden; box-shadow: 0 2px 5px rgba(0,0,0,0.08); border: 1px solid #cbd5e1; cursor: pointer; text-align: center; transition: transform 0.1s; display: flex; flex-direction: column; justify-content: space-between; }
        .item-card:active { transform: scale(0.95); background: #fef9c3; }
        .item-icon { font-size: 22px; padding: 8px 0 3px; background: linear-gradient(135deg, #fffbeb, #fef3c7); }
        .item-name { font-size: 11px; font-weight: bold; padding: 4px; color: #1e293b; line-height: 1.25; }
        .item-price { background: #0f172a; color: #facc15; font-size: 11px; font-weight: bold; padding: 4px; }

        .bill-panel { background: #fff; border-radius: 10px; padding: 10px; box-shadow: 0 3px 10px rgba(0,0,0,0.1); border: 1px solid #94a3b8; }
        .bill-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #0f172a; padding-bottom: 6px; margin-bottom: 8px; }
        .kot-badge { background: #f59e0b; color: #fff; padding: 3px 8px; border-radius: 4px; font-size: 12px; font-weight: bold; }

        .cart-table { width: 100%; border-collapse: collapse; font-size: 12px; }
        .cart-table th { background: #0f172a; color: #fff; padding: 6px 4px; text-align: left; }
        .cart-table td { padding: 6px 4px; border-bottom: 1px solid #e2e8f0; }
        .qty-btn { background: #e2e8f0; border: none; width: 22px; height: 22px; border-radius: 4px; font-weight: bold; cursor: pointer; }
        .qty-btn.plus { background: #10b981; color: #fff; }
        .qty-btn.del { background: #ef4444; color: #fff; }

        .charges-box { background: #f8fafc; border: 1px solid #cbd5e1; border-radius: 6px; padding: 8px; margin-top: 8px; display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 6px; }
        .charges-box label { font-size: 10px; font-weight: bold; color: #475569; display: block; }
        .charges-box input { width: 100%; padding: 4px; border: 1px solid #cbd5e1; border-radius: 4px; font-size: 12px; }

        .totals-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-top: 8px; text-align: center; }
        .total-tile { background: #0f766e; color: #fff; padding: 8px 4px; border-radius: 6px; }
        .total-tile.grand { background: #15803d; }
        .total-tile span { display: block; font-size: 10px; opacity: 0.9; }
        .total-tile strong { font-size: 15px; }

        .action-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 6px; margin-top: 10px; }
        .act-btn { padding: 10px; border: none; border-radius: 6px; font-size: 12px; font-weight: bold; color: #fff; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 5px; }
        .btn-save { background: #0284c7; }
        .btn-kot { background: #d97706; }
        .btn-wa { background: #16a34a; }
        .btn-clear { background: #dc2626; }

        #thermalReceipt { display: none; }
        @media print {
            @page { margin: 4mm; size: auto; }
            html, body { margin: 0 !important; padding: 0 !important; background: #fff !important; }
            body > *:not(#thermalReceipt) { display: none !important; }
            #thermalReceipt {
                display: block !important;
                width: 100%;
                max-width: 78mm;
                margin: 0 auto;
                padding: 4px;
                font-family: 'Courier New', Courier, monospace;
                font-size: 12px;
                color: #000;
                page-break-inside: avoid;
                break-inside: avoid;
            }
        }
    </style>
</head>
<body>

    <div class="top-bar">
        <div class="brand">🍕 THE PIZZA POINT POS</div>
        <div>
            <button onclick="addNewMenuItem()" style="background:#facc15; color:#0f172a; border:none; padding:4px 8px; border-radius:4px; font-size:11px; font-weight:bold; cursor:pointer;">+ Add</button>
            <button onclick="resetDefaultMenu()" style="background:#475569; color:#fff; border:none; padding:4px 8px; border-radius:4px; font-size:11px; font-weight:bold; cursor:pointer;">Reset</button>
            <span class="clock" id="liveClock"></span>
        </div>
    </div>

    <div class="order-types">
        <button class="type-btn" onclick="setOrderType(this, 'DINE IN')">🍽️ DINE IN</button>
        <button class="type-btn active" onclick="setOrderType(this, 'TAKE AWAY')">🛍️ TAKE AWAY</button>
        <button class="type-btn" onclick="setOrderType(this, 'DELIVERY')">🛵 DELIVERY</button>
        <button class="type-btn" onclick="setOrderType(this, 'EXPRESS')">⚡ EXPRESS</button>
    </div>

    <div class="meta-bar">
        <input type="text" id="tableNo" placeholder="Table / Tab #">
        <input type="text" id="custName" placeholder="Customer / Cashier">
        <select id="payMode">
            <option value="CASH">💵 CASH</option>
            <option value="JAZZCASH">📱 JAZZCASH</option>
            <option value="EASYPAISA">📱 EASYPAISA</option>
            <option value="CARD">💳 CARD</option>
        </select>
    </div>

    <div class="delivery-box" id="deliveryAddressBox">
        <input type="text" id="custAddress" placeholder="📍 Enter Customer Delivery Address in Darya Khan...">
    </div>

    <div class="pos-wrapper">
        <div class="menu-panel">
            <div class="cat-scroll" id="categoryBar"></div>
            <div class="menu-grid" id="menuGrid"></div>
        </div>

        <div class="bill-panel">
            <div class="bill-header">
                <div>
                    <strong style="font-size:14px;" id="displayOrderType">TAKE AWAY</strong>
                    <div style="font-size:11px; color:#64748b;">Bill #<span id="billNumber">736</span></div>
                </div>
                <span class="kot-badge">KOT #<span id="kotNumber">1522</span></span>
            </div>

            <div style="max-height: 220px; overflow-y: auto;">
                <table class="cart-table">
                    <thead>
                        <tr>
                            <th>Item</th>
                            <th>Qty</th>
                            <th>Price</th>
                            <th>Total</th>
                            <th></th>
                        </tr>
                    </thead>
                    <tbody id="cartBody">
                        <tr><td colspan="5" style="text-align:center; color:#94a3b8; padding:15px;">Tap items from menu to add</td></tr>
                    </tbody>
                </table>
            </div>

            <div class="charges-box">
                <div>
                    <label>Service / Tax</label>
                    <input type="number" id="serviceCharge" value="0" oninput="renderCart()">
                </div>
                <div>
                    <label>Delivery Fee</label>
                    <input type="number" id="deliveryCharge" value="0" oninput="renderCart()">
                </div>
                <div>
                    <label>Discount (Rs)</label>
                    <input type="number" id="discountAmt" value="0" oninput="renderCart()">
                </div>
            </div>

            <div style="display:flex; gap:8px; margin-top:8px; align-items:center; background:#f1f5f9; padding:6px; border-radius:6px;">
                <label style="font-size:12px; font-weight:bold;">Cash Paid:</label>
                <input type="number" id="cashPaid" placeholder="0" style="flex:1; padding:5px; border:1px solid #cbd5e1; border-radius:4px;" oninput="calcBalance()">
                <div style="font-size:12px; font-weight:bold; color:#0f766e;">Change: Rs <span id="changeDue">0</span></div>
            </div>

            <div class="totals-grid">
                <div class="total-tile">
                    <span>TOTAL ITEMS</span>
                    <strong id="totalQty">0</strong>
                </div>
                <div class="total-tile">
                    <span>SUB TOTAL</span>
                    <strong>Rs <span id="subTotal">0</span></strong>
                </div>
                <div class="total-tile grand">
                    <span>NET BILL</span>
                    <strong>Rs <span id="netTotal">0</span></strong>
                </div>
            </div>

            <div class="action-grid">
                <button class="act-btn btn-save" onclick="printSinglePage('BILL')">🖨️ PRINT BILL (1 PAGE)</button>
                <button class="act-btn btn-kot" onclick="printSinglePage('KOT')">🧾 PRINT KOT (1 PAGE)</button>
                <button class="act-btn btn-wa" onclick="sendWhatsAppBill()">📲 SEND FULL WHATSAPP BILL</button>
                <button class="act-btn btn-clear" onclick="clearCart()">🗑️ CLEAR / NEW</button>
            </div>
        </div>
    </div>

    <div id="thermalReceipt"></div>

<script>
    const SHOP_NAME = "THE PIZZA POINT";
    const SHOP_ADDR = "NEAR MISSILE CHOWK, DARYA KHAN";
    const SHOP_PHONES = "PH# 0327-7206565 , 0313-7206565";

    const specialFlavours = [
        "The Pizza Point Special Pizza", "Beheri Bakan Pizza", "Kabak Crust Pizza",
        "Crown Crust Pizza", "Malai Boti Pizza", "Afghani Pizza",
        "Starring Pizza", "Cheesy Shuffut Pizza", "Labnani Pizza",
        "Doner Pizza", "Mayo Grust Pizza", "Mughial Pizza"
    ];

    const regularFlavours = [

    ];

    const specialPrices = { Small: 650, Medium: 1280, Large: 1630, XL: 2300 };

    let generatedMenu = [];
    let idCounter = 1;

    function addItem(name, price, cat, icon) {
        generatedMenu.push({ id: idCounter++, name, price, cat, icon });
    }

    ["Small", "Medium", "Large", "XL"].forEach(sz => {
        specialFlavours.forEach(f => {
            addItem(`${f} - ${sz}`, specialPrices[sz], `Special ${sz}`, "🍕");
        });
        regularFlavours.forEach(f => {
            addItem(`${f} - ${sz}`, regularPrices[sz], `Regular ${sz}`, "🍕");
        });
    });

    ["Small", "Medium", "Large", "XL"].forEach((sz, idx) => {
        const vegPrices = [170, 200, 230, 280];
        const chzPrices = [150, 200, 250, 330];
        addItem(`Extra Veg/Olives/Mush (${sz})`, vegPrices[idx], "Topping", "🧀");
        addItem(`Extra Chicken Cheese (${sz})`, chzPrices[idx], "Topping", "🧀");
    });

    // Burgers
    addItem("Zinger Burger", 350, "Burgers", "🍔");
    addItem("Tower Burger", 530, "Burgers", "🍔");
    addItem("Patty Burger", 300, "Burgers", "🍔");
    addItem("Cheesy Burger", 380, "Burgers", "🍔");
    addItem("Butt Burger", 550, "Burgers", "🍔");
    addItem("Special Pizza Point Burger", 750, "Burgers", "🍔");
    addItem("Chapli Burger", 290, "Burgers", "🍔");
    addItem("Pizza Burger", 530, "Burgers", "🍔");
    addItem("Zinger Boneless", 550, "Burgers", "🍔");
    addItem("Zinger Cheesy Boneless", 550, "Burgers", "🍔");

    // Shawarma
    addItem("Chicken Shawarma", 200, "Shawarma", "🌯");
    addItem("Chicken Cheesy Shawarma", 310, "Shawarma", "🌯");
    addItem("Special Shawarma", 270, "Shawarma", "🌯");
    addItem("Spicy Shawarma", 250, "Shawarma", "🌯");

    // Wraps
    addItem("Arabic Wraps", 500, "Wraps", "🥙");
    addItem("Tortilla Wraps", 580, "Wraps", "🥙");
    addItem("Zinger Wraps", 600, "Wraps", "🥙");
    addItem("Crunchy Wraps", 620, "Wraps", "🥙");

    // Broast
    addItem("Hot Wings (6 Pcs)", 350, "Broast", "🍗");
    addItem("Hot Wings (12 Pcs)", 700, "Broast", "🍗");
    addItem("Crunchy Wings (6 Pcs)", 380, "Broast", "🍗");
    addItem("Crunchy Wings (12 Pcs)", 750, "Broast", "🍗");
    addItem("Spicy Wings (6 Pcs)", 360, "Broast", "🍗");
    addItem("Spicy Wings (12 Pcs)", 720, "Broast", "🍗");
    addItem("Leg Piece", 430, "Broast", "🍗");
    addItem("Chest Piece", 450, "Broast", "🍗");
    addItem("Full Broast", 1450, "Broast", "🍗");

    // Fries
    addItem("Simple Half Fries", 200, "Fries", "🍟");
    addItem("Simple Large Fries", 300, "Fries", "🍟");
    addItem("Sp. Fries Small", 550, "Fries", "🍟");
    addItem("Sp. Fries Large", 800, "Fries", "🍟");
    addItem("BBQ Fries Large", 750, "Fries", "🍟");
    addItem("Special Fries", 850, "Fries", "🍟");
    addItem("Matka Fries Special", 900, "Fries", "🍟");

    // Paratha Roll
    addItem("Special Pizza Point Paratha", 410, "Paratha Roll", "🌯");
    addItem("Spicy Paratha", 380, "Paratha Roll", "🌯");
    addItem("Crispy Paratha", 330, "Paratha Roll", "🌯");
    addItem("Kabab Paratha", 300, "Paratha Roll", "🌯");
    addItem("Crunchy Paratha", 450, "Paratha Roll", "🌯");

    // Spin Rolls
    addItem("Special The Pizza Point Roll", 530, "Spin Rolls", "🍥");
    addItem("Malai Boti Roll", 500, "Spin Rolls", "🍥");
    addItem("Butt Spin Roll", 480, "Spin Rolls", "🍥");
    addItem("Special Spin Roll", 450, "Spin Rolls", "🍥");

    // Platters
    addItem("Special Platter", 900, "Platters", "🍱");
    addItem("Butt Platter", 850, "Platters", "🍱");
    addItem("Malai Boti Platter", 800, "Platters", "🍱");

    // Pasta
    addItem("Special Pasta", 750, "Pasta", "🍝");
    addItem("Macaroni Pasta", 680, "Pasta", "🍝");
    addItem("Crunchy Pasta", 730, "Pasta", "🍝");
    addItem("Lazania Pasta", 800, "Pasta", "🍝");

    // Sandwich
    addItem("Special Pizza Point Sandwich", 850, "Sandwich", "🥪");
    addItem("Grilled Sandwich", 800, "Sandwich", "🥪");
    addItem("Crunchy Sandwich", 740, "Sandwich", "🥪");
    addItem("Butt Sandwich", 670, "Sandwich", "🥪");

    // Nuggets
    addItem("Nuggets (6 Piece)", 300, "Nuggets", "🍤");
    addItem("Nuggets (12 Piece)", 600, "Nuggets", "🍤");

    // Deals Menu
    addItem("DEAL-1 (1 Sm Pizza, 1 Zinger, 250ml)", 1000, "Deals", "🎁");
    addItem("DEAL-2 (1 Sm Pizza, 2 Nuggets, Fries, Half Ltr)", 1200, "Deals", "🎁");
    addItem("DEAL-3 (2 Large Pizza, 1.5L Drink)", 3000, "Deals", "🎁");
    addItem("DEAL-4 (1 Sm Pizza, 1 Half Pasta, 6 Nuggets, 1L)", 1350, "Deals", "🎁");
    addItem("DEAL-5 (2 Zinger, 6 Hot Wings, 2x 350ml)", 1250, "Deals", "🎁");
    addItem("DEAL-6 (1 L Pizza, 4 Zinger, Large Fries, 1.5L)", 3300, "Deals", "🎁");
    addItem("Super Deal-1 (3 Sm Pizza, 1 Zinger, 1L Drink)", 2550, "Deals", "🔥");
    addItem("Super Deal-2 (2 Med Pizza, 2 Zinger, 1L Drink)", 3250, "Deals", "🔥");
    addItem("Super Deal-3 (1 Sp M Pizza, 12 Wings, 3 Patty, 1.5L)", 3000, "Deals", "🔥");
    addItem("Super Deal-4 (1 Sm Pizza, 2 Zinger, Loaded Fries, 1L)", 1800, "Deals", "🔥");
    addItem("The Pizza Point Deal (6 Zinger, Pasta, 6 Nuggets, L Pizza, Fries, 1.5L)", 4999, "Deals", "👑");
    addItem("Birthday Deal (2 XL, 2 L Pizza, 24 Wings, 3 Patty, Fries, 3 Zinger, 2Lb Cake, 3x 1.5L)", 13400, "Deals", "🎂");

    let menuItems = JSON.parse(localStorage.getItem('tpp_menu_v3')) || generatedMenu;
    let cart = [];
    let selectedCategory = "Special Small";
    let currentOrderType = "TAKE AWAY";
    let billCounter = parseInt(localStorage.getItem('tpp_bill_no')) || 736;
    let kotCounter = parseInt(localStorage.getItem('tpp_kot_no')) || 1522;

    function updateClock() {
        const now = new Date();
        document.getElementById('liveClock').innerText = now.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
    }
    setInterval(updateClock, 1000);
    updateClock();

    function setOrderType(btn, type) {
        document.querySelectorAll('.type-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentOrderType = type;
        document.getElementById('displayOrderType').innerText = type;
        document.getElementById('deliveryAddressBox').style.display = (type === 'DELIVERY') ? 'block' : 'none';
    }

    function renderCategories() {
        const cats = [...new Set(menuItems.map(i => i.cat)), "All"];
        const bar = document.getElementById('categoryBar');
        bar.innerHTML = cats.map(c =>
            `<div class="cat-pill ${c === selectedCategory ? 'active' : ''}" onclick="filterCategory('${c}')">${c}</div>`
        ).join('');
    }

    function filterCategory(cat) {
        selectedCategory = cat;
        renderCategories();
        renderMenu();
    }

    function renderMenu() {
        const grid = document.getElementById('menuGrid');
        const filtered = selectedCategory === "All" ? menuItems : menuItems.filter(i => i.cat === selectedCategory);
        grid.innerHTML = filtered.map(item => `
            <div class="item-card" onclick="addToCart(${item.id})">
                <div class="item-icon">${item.icon}</div>
                <div class="item-name">${item.name}</div>
                <div class="item-price">Rs ${item.price}/-</div>
            </div>
        `).join('');
    }

    function addToCart(id) {
        const item = menuItems.find(i => i.id === id);
        const existing = cart.find(c => c.id === id);
        if (existing) {
            existing.qty += 1;
        } else {
            cart.push({ ...item, qty: 1 });
        }
        renderCart();
    }

    function updateQty(index, delta) {
        cart[index].qty += delta;
        if (cart[index].qty <= 0) {
            cart.spl
